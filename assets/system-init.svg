  <rect x="355" y="158" width="190" height="36" rx="6" fill="#1a0508" stroke="#ff0033">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="181" text-anchor="middle" fill="#ff2244" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">SYSTEM ONLINE</text>
