    <animate attributeName="stroke-dashoffset" values="0;20" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="42" text-anchor="middle" fill="#ff3355" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="3">=w  SPIDER-SYSTEM INITIALIZED  =w
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13" text-anchor="middle" fill="#eaeaea">
