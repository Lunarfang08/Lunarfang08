<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Boot Sequence Terminal">
  <rect width="900" height="360" rx="10" fill="#070707" stroke="#2a2a2a" stroke-width="2"/>
  <rect width="900" height="32" rx="10" fill="#121212"/>
  <circle cx="22" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="16" r="5" fill="#27c93f"/>
  <text x="450" y="21" text-anchor="middle" fill="#777777" font-family="ui-monospace, Menlo, monospace" font-size="12">spider-sense.sh - neural interface</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#cfcfcf">
    <text x="24" y="60" fill="#ff4455">$ sudo ./spider-sense.sh</text>

    <text x="24" y="90" opacity="0">[BOOT] Initializing neural interface...
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.05;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="112" opacity="0">[BOOT] Loading LangGraph agents...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.18;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="134" opacity="0">[BOOT] Connecting OpenAI / Anthropic / Ollama...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.30;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="156" opacity="0">[BOOT] Starting FastAPI + Docker runtime...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.42;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="178" opacity="0">[BOOT] Mounting RAG / Guardrails / Observability...
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.54;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <rect x="24" y="196" width="0" height="14" fill="#ff0033" rx="2">
      <animate attributeName="width" values="0;0;700;700" keyTimes="0;0.55;0.85;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="740" y="208" fill="#ff4455" opacity="0">100%
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.88;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="240" fill="#00ff88" opacity="0">[SYSTEM] AI AGENTS ........ ONLINE
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="262" fill="#00ff88" opacity="0">[SYSTEM] SPIDER-SENSE ..... ONLINE
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.91;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="284" fill="#ffcc00" opacity="0">WARNING: Human deploying without tests - blocked.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.94;0.97;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="320" fill="#ff4455" opacity="0">$ echo "With great power comes great code."
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.96;1;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="24" y="342" fill="#ffffff" opacity="0">With great power comes great code.
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.98;1;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
